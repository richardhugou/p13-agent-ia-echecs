# POC agent IA ouvertures d'échecs — pile complète :
# frontend (nginx) + api + MongoDB + Milvus (etcd, minio) + MLflow.

services:
  frontend:
    build: ./frontend
    container_name: p13-frontend
    ports:
      - "${FRONT_PORT:-4200}:4200"
    depends_on:
      - api

  api:
    build: ./backend
    container_name: p13-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
      MONGO_URI: mongodb://mongodb:27017
      # depuis le conteneur, l'hôte (où tourne Ollama) s'appelle host.docker.internal
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    env_file:
      - path: .env
        required: false
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthcheck')"]
      interval: 15s
      timeout: 5s
      retries: 3

  mongodb:
    image: mongo:7
    container_name: p13-mongodb
    volumes:
      - mongo_data:/data/db

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: p13-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: p13-minio
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data
    volumes:
      - minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.15
    container_name: p13-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      - etcd
      - minio
    ports:
      # exposé à l'hôte pour l'ETL (job local au POC) — en prod l'ETL vivrait dans le réseau
      - "19530:19530"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.0
    container_name: p13-mlflow
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    ports:
      - "5001:5000"  # 5000 côté hôte est squatté par AirPlay (macOS)

volumes:
  mongo_data:
  mlflow_data:
  etcd_data:
  minio_data:
  milvus_data:
