# POC agent IA ouvertures d'échecs — socle (étape 1).
# Les services Milvus (+ etcd, minio), MongoDB et MLflow seront ajoutés aux étapes suivantes.

services:
  api:
    build: ./backend
    container_name: p13-api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/healthcheck')"]
      interval: 15s
      timeout: 5s
      retries: 3
